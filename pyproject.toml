[project]
name = "stepintovision-ingest"
version = "0.1.0"
description = "Content ingestion utilities for the Step Into Vision MCP server."
readme = "README.md"
authors = [{ name = "Step Into Vision MCP" }]
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.12,<3.0",
  "fastmcp==2.12.4",
]

[project.optional-dependencies]
dev = [
  "rich>=13.9.4",
]

[project.scripts]
stepinto-mcp = "stepintovision_mcp.server:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
ignore = [
  "E501",  # handled by formatter preference
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

# NEW — tell setuptools exactly which packages to include
[tool.setuptools.packages.find]
include = ["stepintovision_ingest*", "stepintovision_mcp*"]
exclude = ["data*", "tests*", "docs*", "scripts*"]
